name: Deploy to ECS

# Build once, push to ECR, deploy to ECS Fargate.
#
#   merge to main  -> build + push + deploy STAGING automatically
#   tag v1.2.3     -> deploy PRODUCTION from the SAME digests (no rebuild)
#
# Authentication is GitHub OIDC: Actions exchanges a short-lived token for an
# AWS role at run time. There are NO AWS access keys in GitHub secrets, and
# nothing to rotate.
#
# ── PREREQUISITES (none of these exist yet — 2026-09-02) ──────────────────
#   1. IAM OIDC provider for token.actions.githubusercontent.com
#   2. Role `crm-github-deploy` whose trust policy names THIS repo, with
#      ecr:* on crm/*, ecs:UpdateService/RegisterTaskDefinition, iam:PassRole
#      on the two task roles, and s3:PutObject on the portal buckets
#   3. ECR repositories: crm/directus, crm/socket-gateway, crm/ai-gateway,
#      crm/workers, crm/bootstrap
#   4. Task roles `crm-ecs-execution-role` + `crm-task-role-{staging,prod}`
#
# Until (1) and (2) exist this workflow cannot authenticate and every run fails
# at "Configure AWS credentials". That is the correct behaviour — it fails at
# the door rather than half-deploying.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC. Without it the token exchange fails.

concurrency:
  # Never let two deploys to the same environment overlap; queue instead of
  # cancelling, so a half-finished ECS rollout is not abandoned mid-flight.
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 408568863712.dkr.ecr.us-east-2.amazonaws.com

jobs:
  # ── 1. The gate ───────────────────────────────────────────────────────────
  # Deploy fires on push/tag while CI fires separately, so without this a tag
  # could ship over a red pipeline. That is not hypothetical: v1.1.2 through
  # v1.2.0 all published with a green Deploy badge and failing tests.
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 9.15.0 # pinned to match ci.yml — a different pnpm rejects the lockfile
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # ── 2. Resolve what we are deploying ──────────────────────────────────────
  # One place decides environment + image tag, so no later job can disagree.
  plan:
    name: Plan
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.p.outputs.environment }}
      image_tag: ${{ steps.p.outputs.image_tag }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"; TAG="main"; BUILD=false
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # A TAG IS A PROMOTION, NOT A BUILD. The images already exist from
            # the merge to main; production re-tags those exact digests, so what
            # was tested on staging is byte-for-byte what ships.
            ENVIRONMENT=prod; TAG="${GITHUB_REF#refs/tags/}"; BUILD=false
          else
            ENVIRONMENT=staging; TAG=main; BUILD=true
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying $ENVIRONMENT at tag $TAG (build=$BUILD)"

  # ── 3. Build and push the service images ──────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: directus, dockerfile: directus/Dockerfile }
          - { name: socket-gateway, dockerfile: services/socket-gateway/Dockerfile }
          - { name: ai-gateway, dockerfile: services/ai-gateway/Dockerfile }
          - { name: workers, dockerfile: services/workers/Dockerfile }
          - { name: bootstrap, dockerfile: directus/bootstrap/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408568863712:role/crm-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Tagged with both the branch tag and the commit SHA. The SHA tag is
          # what makes a rollback precise — `main` moves, a SHA does not.
          tags: |
            ${{ env.ECR_REGISTRY }}/crm/${{ matrix.name }}:${{ needs.plan.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/crm/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  # ── 4. Portals: static bundles to S3 + CloudFront ─────────────────────────
  # NOT containers. They are static files; running nginx in Fargate to serve
  # them would cost ~$18/mo each and buy nothing.
  portals:
    name: Build & upload portals
    needs: plan
    runs-on: ubuntu-latest
    steps:
      # TAGS, because the Update now summary is read from the TAG ANNOTATION.
      #
      # `actions/checkout` fetches depth 1 and NO TAGS by default, so
      # `git tag -l --format='%(contents:subject)'` found nothing on the runner
      # and the summary silently fell back to the last commit subject. v1.21.1
      # shipped with "fix(ui): the dark highlight sits on the same hue as the
      # light one" on the strip instead of what the release actually changes.
      #
      # Exactly the gap the feature's own note warned about: staging never runs
      # this block (it is inside the GATED branch), so nothing could catch it
      # before a real production release did.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4.2.0
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build portals
        env:
          # Baked-in FALLBACKS only. The real values come from config.js at
          # runtime (see below), which is what keeps one bundle serving both
          # environments.
          # THESE ARE BAKED INTO THE BUNDLE AT BUILD TIME.
          #
          # A portal cannot be repointed by changing DNS or a task definition —
          # the hostname is compiled in, so a wrong value here ships a portal
          # that loads perfectly and cannot reach its own API. That is exactly
          # what happened: these were set to api./ai./ws.crm.anan.sa on
          # 2026-09-02, hostnames that were planned and never created, so every
          # login silently failed against a host that does not resolve.
          #
          # They must name a host that actually SERVES. Today all three are
          # crm-api.anan.sa, which fronts Directus, socket.io and the AI gateway
          # on one distribution.
          VITE_DIRECTUS_URL: ${{ vars.VITE_DIRECTUS_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          VITE_AI_GATEWAY_URL: ${{ vars.VITE_AI_GATEWAY_URL }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm --filter @yiji/agent-portal build
          pnpm --filter @yiji/admin-portal build

      - name: Generate runtime config
        # On S3 there is no container, so nothing writes config.js the way
        # docker-entrypoint.sh does. Without this the portal falls back to the
        # baked VITE_* value and the bundle becomes environment-specific.
        run: |
          ./scripts/gen-portal-config.sh ${{ needs.plan.outputs.environment }} \
            apps/agent-portal/dist/config.js
          ./scripts/gen-portal-config.sh ${{ needs.plan.outputs.environment }} \
            apps/admin-portal/dist/config.js

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408568863712:role/crm-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # WHAT THE OWNER SEES IMMEDIATELY, AND WHAT WAITS FOR THEM.
      #
      # On prod the AGENT portal parks its new entry point at
      # `pending/index.html` and leaves the live one alone, so a design change
      # or new feature reaches agents at a moment the owner chooses rather than
      # mid-shift. The ADMIN portal always deploys straight to live.
      #
      # That asymmetry is the whole reason this works. The release button lives
      # in the admin portal, so gating the admin portal traps the button inside
      # the build it is meant to release — you cannot press the thing that
      # would ship the thing. We hit exactly that on 2026-09-16. An always-live
      # admin portal means the button always exists and is always the newest
      # one.
      #
      # STAGING IS NEVER GATED: it exists to be looked at immediately, and
      # asking somebody to press a button before they can test what they merged
      # is friction with nothing behind it.
      - name: Upload to S3
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          for app in agent admin; do
            BUCKET="crm-${ENVIRONMENT}-${app}-portal"
            # Does THIS surface wait for the owner? Only the agent portal, and
            # only on prod.
            if [ "$ENVIRONMENT" = "prod" ] && [ "$app" = "agent" ]; then
              GATED=1
            else
              GATED=0
            fi

            # Hashed assets first, cached hard. Vite content-hashes filenames,
            # so a year is safe and correct.
            #
            # `--delete` is dropped for a GATED surface. It prunes the bucket to
            # exactly the new build, which would delete the assets the LIVE
            # build is still serving — the portal would go blank between deploy
            # and release. Correct right up until a release stopped being
            # immediate.
            if [ "$GATED" = "1" ]; then DELETE=""; else DELETE="--delete"; fi
            aws s3 sync "apps/${app}-portal/dist" "s3://${BUCKET}" \
              $DELETE --cache-control "public,max-age=31536000,immutable" \
              --exclude "index.html" --exclude "config.js"

            # index.html and config.js have STABLE names and must never be
            # cached: a cached config.js means the portal talks to the previous
            # environment's API until someone hard-refreshes — an outage with no
            # error message.
            #
            # config.js goes live even on a gated surface: it is environment
            # config, identical across builds of the same environment, and a
            # portal pointed at the wrong API is an outage nobody can see.
            aws s3 cp "apps/${app}-portal/dist/config.js" "s3://${BUCKET}/config.js" \
              --cache-control "no-cache"

            if [ "$GATED" = "1" ]; then
              aws s3 cp "apps/${app}-portal/dist/index.html" "s3://${BUCKET}/pending/index.html" \
                --cache-control "no-cache"
              BUNDLE=$(grep -o "/assets/index-[A-Za-z0-9_-]*[.]js" "apps/${app}-portal/dist/index.html" | head -1)
              echo "::notice::${app} portal published (${BUNDLE}) - waiting for Update now"
              # THE VERSION TRAVELS IN THE BUCKET, not over HTTP.
              #
              # This used to POST the build to the gateway so the banner could
              # name a version. That needed two repository secrets, and this
              # repo has NONE — CI authenticates to AWS by OIDC role assumption,
              # so there is no token to give it and never will be. The callback
              # was dead code that warned on every run.
              #
              # A tiny JSON file beside the parked page carries the same facts,
              # written with the S3 access the deploy already has. The gateway
              # reads it when it reads the parked build: same trip, no secret,
              # and it cannot drift out of step with the page it describes.
              # WHAT THIS RELEASE CHANGES, in one line, for the Update now strip.
              #
              # Taken from the TAG'S OWN ANNOTATION -- its first line -- because
              # that is already written for every production release and cannot
              # drift from the build it describes. No new process and no second
              # place to remember.
              #
              # The leading "vX.Y.Z - " is stripped (the strip shows the version
              # separately) and it is capped, so a long subject cannot push the
              # button off a narrow screen. EMPTY on staging, where the ref is a
              # branch with no annotation; the strip then names the surfaces
              # exactly as it did before.
              # ONLY AN ANNOTATED TAG, never a commit subject.
              #
              # `%(contents:subject)` falls back to the TAGGED COMMIT's subject when the
              # object is a lightweight ref -- which is what a shallow fetch leaves
              # behind. v1.21.1 shipped a CSS commit message on the strip because of it.
              #
              # `git cat-file -t` is `tag` only for a real annotation, so this is EMPTY
              # rather than WRONG when there is none. Empty is handled (the strip names
              # the surfaces); wrong is not, because it looks like it worked.
              # RE-FETCH THE TAG OBJECT FIRST.
              #
              # `actions/checkout` fetches the real tags, then OVERWRITES the one it
              # is building with a lightweight ref pointing at the commit:
              #   git fetch --no-tags ... +<sha>:refs/tags/<tag>
              # so the annotation is gone by the time this runs, however the
              # checkout is configured. v1.22.0 published an EMPTY summary that way
              # (the guard below did its job and refused to print a commit subject).
              #
              # The remote still has the annotated object, so ask for it again.
              # `|| true`: a missing tag is not a reason to fail a deploy - the
              # guard below then leaves the summary empty, which is handled.
              git fetch --force origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION" 2>/dev/null || true
              if [ "$(git cat-file -t "$RELEASE_VERSION" 2>/dev/null)" = "tag" ]; then
                SUMMARY=$(git tag -l --format='%(contents:subject)' "$RELEASE_VERSION" 2>/dev/null \
                  | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+//' | sed -E 's/^[^[:alnum:]]+//' | cut -c1-90)
              else
                SUMMARY=""
              fi
              # BUILT WITH jq, not printf.
              #
              # A hand-rolled printf has to escape the summary itself, and the
              # sed that did it broke on its own backslashes -- silently, which
              # is the worst way: the file was still written, with an EMPTY
              # summary, so the strip would have quietly lost the one line this
              # change exists to add. jq emits correct JSON for any input, which
              # is what it is for. Already used elsewhere in CI, so it is
              # present on the runner.
              # EVERY VERSION STILL WAITING, not only this one (owner, 2026-10-07).
              #
              # One "Update now" released v1.38.8 AND v1.39.0 together: the newer
              # build had been parked on top of the one the owner meant to release,
              # and the strip named only the newest. So when the build already
              # parked here is NOT what is live, its changes are carried into this
              # file and the strip lists them all before anybody clicks.
              PREV=$(aws s3 cp "s3://${BUCKET}/pending/release.json" - 2>/dev/null || echo '{}')
              LIVE=$(aws s3 cp "s3://${BUCKET}/index.html" - 2>/dev/null | grep -o "/assets/index-[A-Za-z0-9_-]*[.]js" | head -1)
              PREV_BUNDLE=$(echo "$PREV" | jq -r '.bundle // empty' 2>/dev/null || true)
              if [ -n "$PREV_BUNDLE" ] && [ "$PREV_BUNDLE" != "$LIVE" ]; then
                CARRY=$(echo "$PREV" | jq -c '(.changes // [{version:(.version // ""), summary:(.summary // "")}]) | map(select(.version != ""))' 2>/dev/null || echo '[]')
              else
                CARRY='[]'
              fi
              jq -n --arg version "$RELEASE_VERSION" \
                    --arg commit "$(echo "$GITHUB_SHA" | cut -c1-7)" \
                    --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg app "$app" --arg bundle "$BUNDLE" --arg summary "$SUMMARY" \
                    --argjson carry "$CARRY" \
                    '{version:$version,commit:$commit,publishedAt:$publishedAt,app:$app,bundle:$bundle,summary:$summary,changes:(([{version:$version,summary:$summary}] + $carry) | unique_by(.version) | sort_by(.version | ltrimstr("v") | split(".") | map(tonumber? // 0)))}' \
                > /tmp/release.json
              aws s3 cp /tmp/release.json "s3://${BUCKET}/pending/release.json" \
                --cache-control "no-cache" --content-type "application/json"
            else
              aws s3 cp "apps/${app}-portal/dist/index.html" "s3://${BUCKET}/index.html" \
                --cache-control "no-cache"
            fi
          done

      # THE CUSTOMER-FACING BUNDLE, which CI did not ship until 2026-09-09.
      #
      # The loop above covers the two staff portals; the widget had its own
      # bucket that nothing in this workflow wrote to, so it shipped only when
      # somebody remembered to run scripts/deploy-portals.sh by hand. A fix
      # could pass every gate, merge, deploy green — and not reach a single
      # customer. Found when a widget fix verified on localhost was still
      # absent from staging after a successful deploy.
      #
      # Built by the same script a human would run, so the two cannot drift.
      - name: Build the customer chat widget
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # `bash script` rather than `./script`: the file mode is set in git too,
        # but a mode is easy to lose on a Windows checkout or a re-add, and the
        # failure is a bare "Permission denied" that says nothing about why.
        run: bash scripts/build-widget.sh ${{ needs.plan.outputs.environment }}

      - name: Upload the widget to S3
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # `crm-prod-widget` belongs to somebody else's account-wide name, so
          # production carries the account id — see scripts/deploy-portals.sh.
          if [ "$ENVIRONMENT" = prod ]; then
            BUCKET="crm-prod-widget-408568863712"
          else
            BUCKET="crm-${ENVIRONMENT}-widget"
          fi
          SRC=apps/chat-widget/dist
          test -f "$SRC/yiji-chat-widget.js" || { echo "::error::the widget bundle is missing"; exit 1; }
          test -f "$SRC/index.html" && test -f "$SRC/walk-in.html" \
            || { echo "::error::the widget pages are missing"; exit 1; }

          # Hashed assets: cached hard, and NOT deleted.
          #
          # `--delete` here breaks the chat for anyone holding the page when a
          # deploy lands. Their HTML still names the previous chunk, the deploy
          # removes it, the request 403s, and the widget never boots - it sits
          # on "connecting" for ever, cannot send, and shows neither the online
          # nor the offline details, because the code that decides all three
          # never ran. Reported by the owner immediately after v1.8.0, and
          # reproduced exactly by pointing a current page at the deleted chunk.
          #
          # Filenames are content-hashed, so keeping the old ones costs a few KB
          # and nothing else: a name can never resolve to the wrong bytes.
          aws s3 sync "$SRC/assets" "s3://${BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable" >/dev/null
          # Everything else except the pages, five minutes: the bundle's name is
          # STABLE, so a fix has to be able to reach browsers the same day.
          #
          # `pending/` is EXCLUDED from the prune. Without it this sync would
          # delete the parked pages it had just uploaded — the release would
          # have nothing to promote, and the deploy would report success. A
          # gated surface and a `--delete` sync in the same bucket is exactly
          # the pairing that goes wrong quietly.
          aws s3 sync "$SRC" "s3://${BUCKET}" --delete \
            --exclude "assets/*" --exclude "*.html" --exclude "walk-in" \
            --exclude "pending/*" \
            --cache-control "public,max-age=300" >/dev/null
          # THE PAGES, and on prod they WAIT FOR THE OWNER.
          #
          # Never cached, because they name the hashed assets. On prod the new
          # ones are parked under `pending/` and the live pages are left alone,
          # so a design change reaches customers when the owner releases it
          # rather than the moment CI goes green. That matters most here: this
          # is the surface people outside the company see.
          #
          # The assets above are uploaded WITHOUT `--delete`, so both builds'
          # chunks coexist and the live page keeps working untouched while the
          # new one waits.
          if [ "$ENVIRONMENT" = prod ]; then
            for page in index.html walk-in.html; do
              aws s3 cp "$SRC/$page" "s3://${BUCKET}/pending/$page" \
                --cache-control "no-cache" --content-type "text/html; charset=utf-8" >/dev/null
            done
            # The QR poster's extensionless key needs its own object, parked
            # too — releasing must swap all three together or a scanned code
            # would serve a page from a different build.
            aws s3 cp "$SRC/walk-in.html" "s3://${BUCKET}/pending/walk-in" \
              --cache-control "no-cache" --content-type "text/html; charset=utf-8" >/dev/null
            WBUNDLE=$(grep -o "/assets/index-[A-Za-z0-9_-]*[.]js" "$SRC/index.html" | head -1)
            echo "::notice::chat widget published (${WBUNDLE}) - waiting for Update now"
            # The version, beside the parked pages — see the note on the portal
            # loop. No secret, no HTTP callback, and it cannot drift out of step
            # with the build it describes.
            # Same one-line summary as the portals -- see the note there.
            # Annotated tags only -- see the note in the portals job.
            # RE-FETCH THE TAG OBJECT FIRST.
            #
            # `actions/checkout` fetches the real tags, then OVERWRITES the one it
            # is building with a lightweight ref pointing at the commit:
            #   git fetch --no-tags ... +<sha>:refs/tags/<tag>
            # so the annotation is gone by the time this runs, however the
            # checkout is configured. v1.22.0 published an EMPTY summary that way
            # (the guard below did its job and refused to print a commit subject).
            #
            # The remote still has the annotated object, so ask for it again.
            # `|| true`: a missing tag is not a reason to fail a deploy - the
            # guard below then leaves the summary empty, which is handled.
            git fetch --force origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION" 2>/dev/null || true
            if [ "$(git cat-file -t "$RELEASE_VERSION" 2>/dev/null)" = "tag" ]; then
              WSUMMARY=$(git tag -l --format='%(contents:subject)' "$RELEASE_VERSION" 2>/dev/null \
                | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+//' | sed -E 's/^[^[:alnum:]]+//' | cut -c1-90)
            else
              WSUMMARY=""
            fi
            # jq, for the same reason as the portals above.
            # EVERY VERSION STILL WAITING, not only this one (owner, 2026-10-07).
            #
            # One "Update now" released v1.38.8 AND v1.39.0 together: the newer
            # build had been parked on top of the one the owner meant to release,
            # and the strip named only the newest. So when the build already
            # parked here is NOT what is live, its changes are carried into this
            # file and the strip lists them all before anybody clicks.
            PREV=$(aws s3 cp "s3://${BUCKET}/pending/release.json" - 2>/dev/null || echo '{}')
            LIVE=$(aws s3 cp "s3://${BUCKET}/index.html" - 2>/dev/null | grep -o "/assets/index-[A-Za-z0-9_-]*[.]js" | head -1)
            PREV_BUNDLE=$(echo "$PREV" | jq -r '.bundle // empty' 2>/dev/null || true)
            if [ -n "$PREV_BUNDLE" ] && [ "$PREV_BUNDLE" != "$LIVE" ]; then
              CARRY=$(echo "$PREV" | jq -c '(.changes // [{version:(.version // ""), summary:(.summary // "")}]) | map(select(.version != ""))' 2>/dev/null || echo '[]')
            else
              CARRY='[]'
            fi
            jq -n --arg version "$RELEASE_VERSION" \
                  --arg commit "$(echo "$GITHUB_SHA" | cut -c1-7)" \
                  --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --arg app "chat widget" --arg bundle "$WBUNDLE" --arg summary "$WSUMMARY" \
                  --argjson carry "$CARRY" \
                  '{version:$version,commit:$commit,publishedAt:$publishedAt,app:$app,bundle:$bundle,summary:$summary,changes:(([{version:$version,summary:$summary}] + $carry) | unique_by(.version) | sort_by(.version | ltrimstr("v") | split(".") | map(tonumber? // 0)))}' \
              > /tmp/widget-release.json
            aws s3 cp /tmp/widget-release.json "s3://${BUCKET}/pending/release.json" \
              --cache-control "no-cache" --content-type "application/json" >/dev/null
          else
            for page in index.html walk-in.html; do
              aws s3 cp "$SRC/$page" "s3://${BUCKET}/$page" \
                --cache-control "no-cache" --content-type "text/html; charset=utf-8" >/dev/null
            done
            # The QR poster's URL has no extension, so S3 needs its own object
            # at that key. Miss it and every scanned code 404s.
            aws s3 cp "$SRC/walk-in.html" "s3://${BUCKET}/walk-in" \
              --cache-control "no-cache" --content-type "text/html; charset=utf-8" >/dev/null
          fi

          # WITHOUT THIS THE UPLOAD IS INVISIBLE. CloudFront keeps serving what
          # it already has until told otherwise, so a customer would get the old
          # widget for up to the cache lifetime — which is exactly the failure
          # this whole step exists to stop.
          #
          # The ids are LITERAL, not discovered: the deploy role is granted
          # `cloudfront:CreateInvalidation` and nothing else, so a
          # list-distributions lookup returns empty and the invalidation would
          # be skipped in silence. Same two ids as scripts/deploy-portals.sh.
          if [ "$ENVIRONMENT" = prod ]; then DIST=E15DCMX8ZCU62R; else DIST=E2QVORODPLQHNB; fi
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' >/dev/null
          echo "::notice::widget uploaded to $BUCKET and $DIST invalidated"

  # ── 5a. ONE approval for the whole release ────────────────────────────────
  #
  # The gate lives here, on a job with NO matrix, and nothing else in the
  # workflow declares `environment:`.
  #
  # It used to sit on the deploy matrix itself. A GitHub Environment gate is
  # evaluated PER JOB, and a matrix is four jobs, so a protected environment
  # asked for the same release to be approved four times — once per service —
  # and each approval released only its own leg. Worse, `smoke` needs the whole
  # matrix, so while any leg was still waiting its dependency was unsatisfied
  # and the smoke job SKIPPED: production shipped with no end-to-end check at
  # all, which is exactly the "green pipeline that proves nothing" this file
  # warns about elsewhere. Both symptoms were one cause (2026-09-13, v1.14.1).
  #
  # An empty job is the whole point: approving it is the decision, and the
  # deploy matrix simply waits on it.
  approve:
    name: Approve ${{ needs.plan.outputs.environment }} release
    needs: [plan, build, portals]
    if: always() && needs.plan.result == 'success' && needs.build.result != 'failure' && needs.portals.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - name: Record what is being released
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: echo "::notice::approved ${IMAGE_TAG} -> ${ENVIRONMENT}"

  # ── 5b. Deploy the ECS services ───────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }} to ${{ needs.plan.outputs.environment }}
    needs: [plan, build, portals, approve]
    # `always()` + the failure check: build is SKIPPED on a tag promotion (no
    # rebuild), and a skipped dependency would otherwise block this job.
    # `approve` must genuinely have SUCCEEDED — `always()` would otherwise let a
    # rejected or cancelled approval through, which is the one thing the gate
    # exists to prevent.
    if: always() && needs.plan.result == 'success' && needs.build.result != 'failure' && needs.portals.result == 'success' && needs.approve.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # DIRECTUS FIRST, THE REST TOGETHER (owner, 2026-10-07).
      #
      # This was `max-parallel: 1`: all four one after another, ~12 of every
      # deploy's ~16 minutes, because each waits for its rollout to settle.
      # Only Directus has to lead — the gateway, AI gateway and workers talk to
      # it, not to each other — so they now start together and each one's
      # first step waits for Directus to be live on THIS run's rollout.
      max-parallel: 4
      matrix:
        service: [directus, socket-gateway, ai-gateway, workers]
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408568863712:role/crm-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The ordering `max-parallel: 1` used to give: nothing but Directus
      # rolls until Directus has finished rolling out in THIS run. Judged by
      # the rollout's start time, not the image tag — staging always deploys
      # `:main`, so "directus runs :main" is true before it has moved at all.
      # Every leg starts together after the approval, so Directus's new
      # deployment is created after this step begins (a minute of slack).
      - name: Wait for Directus to go live first
        if: matrix.service != 'directus'
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          SINCE=$(( $(date +%s) - 60 ))
          for i in $(seq 1 90); do
            read -r CREATED STATE < <(aws ecs describe-services --cluster "crm-${ENVIRONMENT}" --services directus --query 'services[0].deployments[?status==`PRIMARY`]|[0].[createdAt,rolloutState]' --output text)
            CREATED_S=$(date -d "$CREATED" +%s 2>/dev/null || echo 0)
            if [ "$CREATED_S" -ge "$SINCE" ] && [ "$STATE" = "COMPLETED" ]; then
              echo "::notice::directus live (rollout started $CREATED) — deploying ${{ matrix.service }}"
              exit 0
            fi
            sleep 20
          done
          echo "::error::directus did not finish a new rollout within 30 minutes — not deploying ${{ matrix.service }}"
          exit 1

      # DERIVED FROM WHAT IS RUNNING, not from the repo template.
      #
      # The templates in deploy/aws/ecs/ carry {{SECRET:...}} placeholders for
      # an SSM store this account cannot use, plus {{API_URL}} and
      # {{PORTAL_ORIGINS}} that the old sed never substituted. So a rendered
      # file reached ECS with the LITERAL string "{{SECRET:DB_PASSWORD}}" as
      # the database password: the task started, Postgres answered 28P01
      # "authentication failed", ECS rolled back, and the deploy job sat for
      # ten minutes before failing on "Waiter ServicesStable: Max attempts
      # exceeded" — an error that says nothing about the cause.
      #
      # The live revision already holds every value that works. Taking it and
      # changing ONLY the image is what scripts/deploy-service.sh has always
      # done, and it cannot reintroduce a placeholder.
      - name: Build the task definition from the live one
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          # The revision the SERVICE is running, not the family's latest.
          #
          # Those differ, and the difference matters: earlier runs of this
          # workflow registered broken renders that ECS refused to start and
          # rolled back from. Those revisions are still the NEWEST in the
          # family, so asking for the family by name returns the one that
          # failed. Asking the service returns the one actually serving
          # traffic — by definition a configuration that works.
          RUNNING=$(aws ecs describe-services --cluster "crm-${ENVIRONMENT}" --services "${{ matrix.service }}" --query 'services[0].taskDefinition' --output text)
          if [ -z "$RUNNING" ] || [ "$RUNNING" = "None" ]; then echo "::error::crm-${ENVIRONMENT}/${{ matrix.service }} is not running — bootstrap it once with scripts/bootstrap-prod-taskdefs.mjs"; exit 1; fi
          echo "::notice::deriving from $RUNNING"
          aws ecs describe-task-definition --task-definition "$RUNNING" --query taskDefinition --output json > /tmp/live.json

          IMAGE="${{ env.ECR_REGISTRY }}/crm/${{ matrix.service }}:${IMAGE_TAG}"
          node -e '
            const fs = require("fs");
            const td = JSON.parse(fs.readFileSync("/tmp/live.json", "utf8"));
            // describe returns fields register rejects.
            for (const k of ["taskDefinitionArn","revision","status","requiresAttributes",
                             "compatibilities","registeredAt","registeredBy","deregisteredAt"]) delete td[k];
            td.containerDefinitions[0].image = process.argv[1];
            fs.writeFileSync("/tmp/taskdef.json", JSON.stringify(td, null, 2));
            console.log("image ->", process.argv[1]);
          ' "$IMAGE"

      # An unsubstituted placeholder must never reach ECS again. This is the
      # check that would have caught the 28P01 failure at the door.
      - name: Guard — no unrendered placeholders
        run: |
          if grep -o "{{[A-Za-z_:]*}}" /tmp/taskdef.json | sort -u | grep .; then
            echo "::error::the task definition contains unsubstituted placeholders (above) — refusing to register"
            exit 1
          fi
          echo "no placeholders"

      - name: Guard — staging may deliver ONLY to a redirect handset
        # Real money, real customers, and delivery works from a BACKLOG: the
        # first sweep after it goes live sends every approved-undelivered coupon
        # at once. A bad substitution here must stop the deploy, not ship.
        #
        # Staging was flatly forbidden from delivering until 2026-09-22, when
        # the owner asked for it so the flow could be tested end to end. It is
        # allowed now on ONE condition, enforced here: every coupon and push
        # must be redirected to a test handset. Staging shares Yiji's
        # PRODUCTION APIs, so an unredirected send reaches a real stranger and
        # cannot be revoked from our side.
        #
        # Checked in the TASK DEFINITION rather than trusting the worker's own
        # startup guard: a deploy that never starts is a broken environment,
        # and this stops it at the door instead.
        if: matrix.service == 'workers' && needs.plan.outputs.environment != 'prod'
        run: |
          # PARSED, not grepped. The first version of this used
          # `grep -A1 '"NAME"'` to find each value, which only works while the
          # renderer happens to put "name" and "value" on separate lines. That
          # is a property of JSON.stringify's indent, not of the data, and a
          # guard that protects real money must not rest on whitespace.
          node -e '
            const td = JSON.parse(require("fs").readFileSync("/tmp/taskdef.json", "utf8"));
            const env = Object.fromEntries(
              (td.containerDefinitions?.[0]?.environment ?? []).map((e) => [e.name, e.value]),
            );
            if (!("YIJI_COUPON_DELIVERY" in env)) {
              console.log("::error::coupon flag missing from the task definition");
              process.exit(1);
            }
            if (env.YIJI_COUPON_DELIVERY !== "on") {
              console.log("coupon delivery off");
              process.exit(0);
            }
            // Staging shares Yijis PRODUCTION APIs: an unredirected send
            // reaches a real stranger and cannot be revoked from our side.
            for (const v of ["COUPON_REDIRECT_PHONE", "PUSH_REDIRECT_PHONE"]) {
              if (!/^[0-9+][0-9]{6,}$/.test((env[v] ?? "").trim())) {
                console.log(
                  `::error::YIJI_COUPON_DELIVERY=on but ${v} is missing or empty — a staging send would reach a REAL customer. Refusing.`,
                );
                process.exit(1);
              }
            }
            console.log("coupon delivery on, and both redirects are set — allowed");
          '

      # A TAG IS A PROMOTION, so make the promotion actually happen.
      #
      # The plan job sets build=false for a tag: the image was built when the
      # commit merged to main. But that build only ever applies two tags,
      # `main` and `sha-<commit>` — nothing anywhere created `v1.2.3`. So the
      # verify step below would fail on every service, and the release could
      # not ship without someone re-tagging by hand. (It happened on v1.7.0.)
      #
      # Re-tagging is a manifest PUT, not a rebuild: the digest is unchanged,
      # so what staging tested is byte-for-byte what production runs — which is
      # the whole point of promoting by tag rather than building again.
      #
      # Idempotent: putting a tag that already points at this digest is a no-op,
      # so a re-run is safe. If the tag already exists on a DIFFERENT digest we
      # stop, because that means someone moved a release tag and the operator
      # needs to decide, not us.
      - name: Promote — tag the tested digest with the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          REPO="crm/${{ matrix.service }}"
          SRC=$(aws ecr describe-images --repository-name "$REPO"             --image-ids imageTag=main             --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -z "$SRC" ] || [ "$SRC" = "None" ]; then
            echo "::error::$REPO:main not found — nothing to promote"; exit 1
          fi

          CUR=$(aws ecr describe-images --repository-name "$REPO"             --image-ids imageTag="${IMAGE_TAG}"             --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ "$CUR" = "$SRC" ]; then
            echo "::notice::$REPO:${IMAGE_TAG} already points at $SRC"; exit 0
          fi
          if [ -n "$CUR" ] && [ "$CUR" != "None" ]; then
            echo "::error::$REPO:${IMAGE_TAG} already exists on a different digest ($CUR, not $SRC) — refusing to move a release tag"
            exit 1
          fi

          # --output text MANGLES the manifest (whitespace and escaping), and
          # ECR then stores a re-serialised copy under a DIFFERENT digest — a
          # different image identity than the one that was tested. Read it as
          # JSON and write the raw string.
          aws ecr batch-get-image --repository-name "$REPO"             --image-ids imageDigest="$SRC" --output json > /tmp/bgi.json
          MEDIA=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/bgi.json", "utf8")).images[0].imageManifest;
            fs.writeFileSync("/tmp/manifest.json", m);
            process.stdout.write(JSON.parse(m).mediaType);
          ')
          OUT=$(aws ecr put-image --repository-name "$REPO"             --image-tag "${IMAGE_TAG}"             --image-manifest file:///tmp/manifest.json             --image-manifest-media-type "$MEDIA"             --query 'image.imageId.imageDigest' --output text)
          if [ "$OUT" != "$SRC" ]; then
            echo "::error::promotion changed the digest ($OUT != $SRC) — the manifest was altered in transit"; exit 1
          fi
          echo "::notice::$REPO:${IMAGE_TAG} -> $SRC"

      # NOTHING is registered until the image is confirmed present in ECR.
      #
      # A task definition looks identical whether its image exists or not, so
      # registering first and finding out later is how a rollout gets stuck
      # IN_PROGRESS with 0 running tasks and no error anywhere. (Seen for real:
      # an expired ECR login made two pushes 403 while the deploy carried on.)
      # On a tag promotion the build job is skipped by design — the image was
      # pushed by an earlier run — so this doubles as the check that the tag
      # being promoted actually exists.
      - name: Verify the image is in ECR
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          DIGEST=$(aws ecr describe-images             --repository-name "crm/${{ matrix.service }}"             --image-ids "imageTag=${IMAGE_TAG}"             --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::crm/${{ matrix.service }}:${IMAGE_TAG} is not in ECR — refusing to register a task definition that cannot start"
            exit 1
          fi
          echo "::notice::${{ matrix.service }} image confirmed: $DIGEST"

      - name: Register task definition
        id: reg
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::registered $ARN"

      - name: Update service
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          aws ecs update-service \
            --cluster "crm-${ENVIRONMENT}" \
            --service "${{ matrix.service }}" \
            --task-definition "${{ steps.reg.outputs.arn }}" \
            --query 'service.serviceName' --output text

      - name: Wait for the rollout to stabilise
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          # Fails if the new tasks never reach steady state, which is what turns
          # a broken deploy into a failed workflow rather than a silent one.
          # ECS keeps the old tasks serving until the new ones are healthy.
          aws ecs wait services-stable \
            --cluster "crm-${ENVIRONMENT}" --services "${{ matrix.service }}"
          echo "::notice::${{ matrix.service }} stable"

  # ── 6. Smoke ──────────────────────────────────────────────────────────────
  smoke:
    name: Smoke
    needs: [plan, deploy]
    # RUN THIS, OR THE RELEASE IS UNVERIFIED.
    #
    # With no condition, a single skipped/gated leg in `deploy` left this job
    # skipped — so the v1.14.1 production release shipped with nothing probing
    # it. Stated explicitly: if the deploys succeeded, the smoke test runs.
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Probe the public endpoints
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          # PROBE WHAT IS ACTUALLY SERVING.
          #
          # This used to probe api.staging.crm.anan.sa, a hostname that has
          # never existed: the anan.sa records are still with the team that
          # administers that domain. So the job failed on EVERY run with
          # `curl: (6) Could not resolve host`, long after the deploy it was
          # meant to be checking had succeeded — and the failure emails made a
          # green pipeline indistinguishable from a broken one.
          #
          # It prefers the real hostname and falls back to the CloudFront one
          # that serves today, so the day the DNS is published this starts
          # exercising it with no edit here.
          if [ "$ENVIRONMENT" = "prod" ]; then
            NAMED="crm-api.anan.sa"; FALLBACK="d2ljjkmk6p5y4b.cloudfront.net"
          else
            NAMED="crm-api-staging.anan.sa"; FALLBACK="d2vi34f7wgjecb.cloudfront.net"
          fi
          # RESOLVING IS NOT THE SAME AS SERVING.
          #
          # This used to switch to the named host the moment DNS answered. The
          # CNAMEs were published before the certificate existed, so the probe
          # moved to a hostname CloudFront cannot serve: TLS fails, curl exits
          # 60, and three deploys in a row mailed a failure for a rollout that
          # had in fact succeeded — every service deployed, only the probe was
          # wrong.
          #
          # So prove the domain actually answers over HTTPS before trusting it.
          # One real request decides; anything short of a response falls back.
          if curl -sf -o /dev/null --max-time 10 "https://${NAMED}/server/health"; then
            API="$NAMED"
          else
            API="$FALLBACK"
            echo "::notice::$NAMED is not serving yet (DNS or certificate) — probing $FALLBACK"
          fi

          fail=0
          # PATHS THAT ARE ACTUALLY ROUTED.
          #
          # The old probe hit `/health`, which the ALB does not route at all —
          # it is the container's internal check, reachable only from inside the
          # VPC. Through CloudFront it is a 404, so this could never have passed
          # even with the right hostname. `/admin/config` is the AI gateway's
          # own routed path (see the crm-*-ai listener rules).
          for probe in "/server/health" "/admin/config"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${API}${probe}")
            # 2xx or 401 both prove the service answered: the AI endpoints are
            # authenticated, and an unauthenticated 401 is a HEALTHY response.
            # A 404 or 502 means nothing is behind that path.
            case "$code" in
              2*|401|403) echo "ok   ${API}${probe} ($code)" ;;
              *)          echo "FAIL ${API}${probe} ($code)"; fail=1 ;;
            esac
          done

          # CAN A BROWSER SEND A CUSTOMER PHOTO?
          #
          # Customers could not send photos, twice (2026-09-30, 2026-10-05): the
          # upload sends `Authorization`, the gateway's CORS preflight allowed
          # `content-type` only, and the browser refused before sending a byte.
          # Every check had used plain curl, which ignores CORS. So this asks
          # EXACTLY what a browser asks — an OPTIONS preflight from the widget's
          # origin requesting the widget's headers — and fails the release if
          # the answer would make a browser refuse.
          if [ "$ENVIRONMENT" = "prod" ]; then WIDGET_ORIGIN="https://crm.anan.sa"; else WIDGET_ORIGIN="https://crm-staging.anan.sa"; fi
          pre=$(curl -s -i -X OPTIONS --max-time 15 \
            "https://${API}/chat/attachment?filename=smoke.jpg&type=image%2Fjpeg" \
            -H "Origin: ${WIDGET_ORIGIN}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" | tr -d '\r')
          allow_headers=$(echo "$pre" | grep -i '^access-control-allow-headers:' | tr 'A-Z' 'a-z')
          allow_origin=$(echo "$pre" | grep -i '^access-control-allow-origin:')
          if [ -n "$allow_origin" ] && echo "$allow_headers" | grep -q 'authorization' && echo "$allow_headers" | grep -q 'content-type'; then
            echo "ok   browser preflight for /chat/attachment ($allow_headers)"
          else
            echo "FAIL browser preflight for /chat/attachment: customers cannot upload photos"
            echo "$pre" | grep -i '^\(http\|access-control\)'
            fail=1
          fi
          exit $fail

  # ── 7. Release checks — every release, every environment (EMA-51) ─────────
  #
  # Owner, 2026-10-06/07: "whenever there is a deployment to prod, several
  # things must be checked for sure ... these processes are critical and must
  # be verified on every release." So the same checks run on EVERY deploy, not
  # by hand: every previously solved bug (regressions.mjs, read-only) — the
  # coupon pipelines 1a/1b/2 read back from Yiji, the coupon type, chat
  # previews, the fields the code reads — and on staging also the live chat
  # round-trip and the WeCare-agent permission check (they create and remove
  # their own test data, so they stay off production).
  #
  # Credentials: the release-check login lives in repo secrets
  # RELEASE_CHECK_<ENV>_EMAIL / _PASSWORD (a dedicated account, owner-approved);
  # the Yiji login is read from the workers' live task definition, which this
  # role can already describe. Without the secrets the job says so loudly.
  release-checks:
    name: Release checks (${{ needs.plan.outputs.environment }})
    needs: [plan, smoke]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ needs.plan.outputs.environment }}
      CHECK_EMAIL_STAGING: ${{ secrets.RELEASE_CHECK_STAGING_EMAIL }}
      CHECK_PASSWORD_STAGING: ${{ secrets.RELEASE_CHECK_STAGING_PASSWORD }}
      CHECK_EMAIL_PROD: ${{ secrets.RELEASE_CHECK_PROD_EMAIL }}
      CHECK_PASSWORD_PROD: ${{ secrets.RELEASE_CHECK_PROD_PASSWORD }}
      CHECK_PHONE_STAGING: ${{ secrets.RELEASE_CHECK_STAGING_PHONE }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.2.0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install (the chat round-trip needs socket.io-client)
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408568863712:role/crm-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the release checks
        run: |
          if [ "$ENVIRONMENT" = prod ]; then
            API=https://crm-api.anan.sa; ORIGIN=https://crm.anan.sa
            EMAIL="$CHECK_EMAIL_PROD"; PASSWORD="$CHECK_PASSWORD_PROD"
          else
            API=https://crm-api-staging.anan.sa; ORIGIN=https://crm-staging.anan.sa
            EMAIL="$CHECK_EMAIL_STAGING"; PASSWORD="$CHECK_PASSWORD_STAGING"
          fi
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::RELEASE CHECKS NOT RUN on $ENVIRONMENT — add the RELEASE_CHECK_${ENVIRONMENT^^}_EMAIL / _PASSWORD secrets (EMA-51)."
            exit 0
          fi

          # The Yiji login the workers use, from their RUNNING task definition.
          TD=$(aws ecs describe-services --cluster "crm-${ENVIRONMENT}" --services workers --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition.containerDefinitions[0].environment' --output json > /tmp/wenv.json
          export YIJI_ADMIN_API_URL=$(node -e 'console.log(require("/tmp/wenv.json").find(e=>e.name==="YIJI_ADMIN_API_URL")?.value??"")')
          export YIJI_ADMIN_EMAIL=$(node -e 'console.log(require("/tmp/wenv.json").find(e=>e.name==="YIJI_ADMIN_EMAIL")?.value??"")')
          export YIJI_ADMIN_PASSWORD=$(node -e 'console.log(require("/tmp/wenv.json").find(e=>e.name==="YIJI_ADMIN_PASSWORD")?.value??"")')
          echo "::add-mask::$YIJI_ADMIN_PASSWORD"
          rm -f /tmp/wenv.json

          fail=0
          API="$API" ENV="$ENVIRONMENT" ADMIN_EMAIL="$EMAIL" ADMIN_PASSWORD="$PASSWORD" \
            node scripts/release-check/regressions.mjs || fail=1

          if [ "$ENVIRONMENT" != prod ]; then
            if [ -n "$CHECK_PHONE_STAGING" ]; then
              API="$API" WIDGET_ORIGIN="$ORIGIN" CHECK_PHONE="$CHECK_PHONE_STAGING" \
                ADMIN_EMAIL="$EMAIL" ADMIN_PASSWORD="$PASSWORD" \
                node scripts/release-check/chat-roundtrip.mjs || fail=1
            else
              echo "::warning::chat round-trip not run — add RELEASE_CHECK_STAGING_PHONE"
            fi
            E="$EMAIL" P="$PASSWORD" node scripts/release-check/staff-permissions.mjs || fail=1
          fi
          exit $fail
