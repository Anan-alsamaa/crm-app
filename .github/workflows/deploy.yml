name: Deploy

# Builds the three Node service images and pushes them to GHCR.
# - Manual runs (workflow_dispatch) let you ship any branch on demand.
# - Pushing a release tag (v1.2.3) builds + tags a versioned release.
#
# Images: ghcr.io/<owner>/<service>:<tags>
# Consume them with docker-compose.prod.yml by setting:
#   REGISTRY=ghcr.io/<owner>  IMAGE_TAG=<tag>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to apply (in addition to sha + branch)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deploy fires on TAGS and CI fires on PUSH, so until now nothing connected
  # them: a tag could be cut on a commit whose tests were failing and every image
  # would still publish. That is not hypothetical — v1.1.2 through v1.2.0 all
  # shipped over a red pipeline with a green Deploy badge. This gate makes a
  # release impossible unless the same checks CI runs pass on the tagged commit.
  gate:
    name: Quality gate (blocks the release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Pinned to match ci.yml — a different pnpm can reject the lockfile.
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build-and-push:
    name: Build & push ${{ matrix.name }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # name = image name; dockerfile = path (services live under services/,
        # the static portals under apps/). Portals additionally consume VITE_*
        # build args (baked into the bundle at build time — see below).
        include:
          - { name: socket-gateway, dockerfile: services/socket-gateway/Dockerfile }
          - { name: workers, dockerfile: services/workers/Dockerfile }
          - { name: ai-gateway, dockerfile: services/ai-gateway/Dockerfile }
          - { name: agent-portal, dockerfile: apps/agent-portal/Dockerfile }
          - { name: admin-portal, dockerfile: apps/admin-portal/Dockerfile }
          # The one-shot schema/roles job. docker-compose.prod.yml already
          # references ${REGISTRY}/bootstrap, and on ECS you RunTask an IMAGE —
          # there is no build context there — so it has to be published like
          # the services rather than built on the host.
          - { name: bootstrap, dockerfile: directus/bootstrap/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A portal bundle bakes its API URLs at BUILD time. If the repo Variables
      # are unset the build-args are empty, Vite treats them as unset, and the
      # code's localhost fallbacks get compiled in — producing an image that
      # looks fine, pushes fine, and cannot work in any browser but the build
      # machine's. Fail here instead of shipping that.
      - name: Require portal URLs before publishing a portal image
        if: contains(matrix.name, 'portal')
        run: |
          missing=
          [ -z "${{ vars.VITE_DIRECTUS_URL }}" ] && missing="$missing VITE_DIRECTUS_URL"
          [ -z "${{ vars.VITE_SOCKET_URL }}" ] && missing="$missing VITE_SOCKET_URL"
          [ -z "${{ vars.VITE_AI_GATEWAY_URL }}" ] && missing="$missing VITE_AI_GATEWAY_URL"
          # Was missing from this guard AND from build-args, so every published
          # portal image up to v1.6.0 baked the Dockerfile's localhost:3031
          # default. Assignment notifications then fail silently in prod: the
          # producer call is best-effort and its caller swallows the error, so
          # nothing surfaces except notifications that never arrive.
          [ -z "${{ vars.VITE_JOB_PRODUCER_URL }}" ] && missing="$missing VITE_JOB_PRODUCER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to build ${{ matrix.name }}: unset repo Variable(s):$missing"
            echo "::error::These are compiled into the SPA. Unset means the image would ship"
            echo "::error::http://localhost:* and be dead for every real user."
            echo "::error::Set them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_* are consumed only by the portal images (baked into the bundle
          # at build time). Set them as repo Variables for a real deploy; unset
          # falls back to the Dockerfile ARG defaults. Harmless for the services
          # (unused ARGs). Never put secrets here — they ship to the browser.
          build-args: |
            VITE_DIRECTUS_URL=${{ vars.VITE_DIRECTUS_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
            VITE_AI_GATEWAY_URL=${{ vars.VITE_AI_GATEWAY_URL }}
            VITE_JOB_PRODUCER_URL=${{ vars.VITE_JOB_PRODUCER_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  widget:
    name: Build & publish chat-widget
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Pinned to match ci.yml — a different pnpm can reject the lockfile.
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WIDGET_DEMO_HOST_PAGE is deliberately NOT set. With it, the build emits a
      # host page that inlines YIJI_JWT_SECRET into static HTML — publishing that
      # would put the customer-token signing key on a public URL.
      - name: Build widget (no demo host page)
        env:
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
        run: pnpm --filter @yiji/chat-widget build
      - name: Fail if the demo host page leaked into the bundle
        run: |
          if [ -f apps/chat-widget/dist/index.html ]; then
            echo "::error::dist/index.html present — the demo host page (which inlines"
            echo "::error::YIJI_JWT_SECRET) must never be published. Refusing to upload."
            exit 1
          fi
          echo "widget dist:"; ls -1 apps/chat-widget/dist
      - uses: actions/upload-artifact@v4
        with:
          name: chat-widget-${{ github.ref_name }}
          path: apps/chat-widget/dist
          retention-days: 90

  summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [build-and-push, widget]
    steps:
      - name: Write summary
        run: |
          {
            echo "## Deploy complete"
            echo ""
            echo "Pushed images to \`ghcr.io/${{ github.repository_owner }}/<image>\`:"
            echo "- socket-gateway"
            echo "- workers"
            echo "- ai-gateway"
            echo "- agent-portal (static SPA / nginx)"
            echo "- admin-portal (static SPA / nginx)"
            echo "- bootstrap (one-shot schema/roles job)"
            echo ""
            echo "chat-widget published as a build artifact (static bundle for S3/CDN)."
            echo ""
            echo "Roll out with:"
            echo '```'
            echo "REGISTRY=ghcr.io/${{ github.repository_owner }} IMAGE_TAG=sha-${{ github.sha }} \\"
            echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
