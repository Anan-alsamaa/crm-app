<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SARA CRM">
  <!--
    The favicon tile — the second supplied version: the mark in white on the
    brand indigo, rounded square.

    SVG rather than a PNG because a favicon is drawn at 16px in a tab and at
    180px on a home screen, and one raster is soft at one of those sizes.

    The WORDMARK is deliberately absent. The artwork carries "SARA CRM" under
    the bars, which is right at poster size and illegible mush at 16px — the
    size this file is actually used at most of the time. The mark alone is the
    recognisable half, so it gets the whole tile.

    This hex is the one place the brand colour is written down twice: a favicon
    has no page to inherit from. It must be kept in step with `--primary` in
    each portal's index.css by hand.
  -->
  <rect width="512" height="512" rx="106" fill="#4B3BD5" />
  <g transform="translate(76 138) scale(0.279)" fill="#FFFFFF">
    <polygon points="187.4,0 327.4,0 304.7,68 164.7,68" />
    <polygon points="159.4,84 299.4,84 281,139 141,139" />
    <polygon points="136,154 276,154 140,561 0,561" />
    <polygon points="304.6,281 444.6,281 257.2,842 117.2,842" />
    <polygon points="609.4,0 749.4,0 562,561 422,561" />
    <polygon points="726.6,281 866.6,281 773,561 633,561" />
    <polygon points="937.6,281 1077.6,281 984,561 844,561" />
    <polygon points="1148.6,281 1288.6,281 1195,561 1055,561" />
  </g>
</svg>
