<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SARA CRM">
  <!--
    The favicon tile: the SARA mark in white on the product's brand colour,
    the same lockup SARA Connect uses for its square.

    SVG rather than the PNG it replaces, because a favicon is rendered at 16px
    on one screen and 180px on another, and a single raster is soft at one of
    those sizes. The geometry is traced from the official artwork — bar width
    140, pitch 211, slant -0.334 on a 1289x842 field — then scaled 0.279 and
    centred.

    Colour is committed here rather than inherited: a favicon has no page to
    take its colour from. It must track --primary by hand if the brand moves.
  -->
  <rect width="512" height="512" rx="104" fill="#3D6FE1" />
  <g transform="translate(76 138) scale(0.279)" fill="#FFFFFF">
    <polygon points="187.4,0 327.4,0 304.7,68 164.7,68" />
    <polygon points="159.4,84 299.4,84 281,139 141,139" />
    <polygon points="136,154 276,154 140,561 0,561" />
    <polygon points="304.6,281 444.6,281 257.2,842 117.2,842" />
    <polygon points="609.4,0 749.4,0 562,561 422,561" />
    <polygon points="726.6,281 866.6,281 773,561 633,561" />
    <polygon points="937.6,281 1077.6,281 984,561 844,561" />
    <polygon points="1148.6,281 1288.6,281 1195,561 1055,561" />
  </g>
</svg>
